name: cerca

on:
  schedule:
    - cron: "0 5 * * *"   # ogni mattina: 7:00 con l'ora legale, 6:00 d'inverno
  workflow_dispatch:      # bottone "Cerca adesso" (tramite il Worker) o a mano da GitHub

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cerca
  cancel-in-progress: false

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_cerca.py
      - run: python cerca.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GROQ_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: Salva gli annunci nel repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/annunci.json
          git diff --cached --quiet || git commit -m "Aggiorna annunci"
          git push
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
